buildscript {
    repositories {
        mavenCentral()
        maven { setUrl("https://maven.vaadin.com/vaadin-prereleases") }
        maven { url "https://plugins.gradle.org/m2/" }
    }
    configurations.classpath {
        exclude group: 'com.vaadin', module: 'hilla-engine-core'
    }
}

plugins {
    id 'war'
    id 'org.gretty' version '4.1.1'
    id 'com.vaadin'
}

defaultTasks("build")

repositories {
    mavenCentral()
    maven { setUrl("https://maven.vaadin.com/vaadin-prereleases") }
    maven { url "https://plugins.gradle.org/m2/" }
}

gretty {
    contextPath = "/"
    servletContainer = 'jetty11'
    httpPort = 8080
}

// The following pnpmEnable = false is not needed as npm is used by default,
// this is just an example of how to configure the Gradle Vaadin Plugin:
// for more configuraion options please see: https://vaadin.com/docs/latest/guide/start/gradle/#all-options
vaadin {
    pnpmEnable = false
}

def junitVersion = '5.10.2'
def junitPlatformVersion = '1.10.2'

dependencies {
    implementation enforcedPlatform("com.vaadin:vaadin-bom:$vaadinVersion")

    // Vaadin
    implementation("com.vaadin:vaadin-core") {
        exclude group: 'com.vaadin', module: 'hilla-dev'
    }

    // logging
    // currently we are logging through the SLF4J API to SLF4J-Simple. See src/main/resources/simplelogger.properties file for the logger configuration
    implementation "org.slf4j:slf4j-simple:2.0.7"

    // TestBench + Selenium
    testImplementation(platform("org.junit:junit-bom:$junitVersion"))
    testImplementation("org.junit.jupiter:junit-jupiter:$junitVersion")
    testImplementation("com.vaadin:vaadin-testbench-junit5:$vaadinVersion")
    testRuntimeOnly("org.seleniumhq.selenium:selenium-chrome-driver:4.19.1")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:$junitPlatformVersion")
}

tasks.register('integrationTest', Test) {
    description = 'Runs all tests including TestBench'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty "HOSTNAME", System.getenv("HOSTNAME") ?: "localhost"
}

tasks.register("startServer", Exec) {
    description = "Start Jetty in background for integration tests"
    commandLine "sh", "-c", "./gradlew appStart"
}

tasks.register("stopServer", Exec) {
    description = "Stop Jetty after integration tests"
    commandLine "sh", "-c", "./gradlew appStop"
}

integrationTest.mustRunAfter(startServer)

tasks.register("verifyIntegration") {
    description = "Run tests with server (for integration tests)"
    group = "verification"
    dependsOn("startServer", "integrationTest", "stopServer")
}

// Run integration tests as part of build
build.dependsOn integrationTest
