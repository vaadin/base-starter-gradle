name: Gradle

on: [push, pull_request]

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Pro Key
      run: |
        [ -z "${{secrets.TB_LICENSE}}" ] && exit 1
        mkdir -p ~/.vaadin/
        echo "${{secrets.TB_LICENSE}}" | jq -Rn 'input | split("/") as $parts | {username: $parts[0], proKey: $parts[1]}' > ~/.vaadin/proKey
    - uses: actions/checkout@v1
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v1
      with:
        java-version: ${{ matrix.java }}
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
    - name: Cache pnpm packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.vaadin
          ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
    - name: Build and Test with Gradle
      run: ./gradlew clean build -Pvaadin.productionMode --stacktrace --info --no-daemon -Pit -Dcom.vaadin.testbench.Parameters.headless=true
    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: build/test-results/test/TEST-*.xml
